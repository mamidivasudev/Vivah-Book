name: gift_register
description: "Offline gift register for weddings and functions."
publish_to: 'none'

# versionName+versionCode. Bump the number after '+' for every Play Store upload.
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7D050A"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
